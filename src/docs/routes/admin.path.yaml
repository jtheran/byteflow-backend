/admin/queues:
  get:
    summary: Panel visual de monitoreo para las colas de Redis (Bull Board)
    description: |
      Renderiza la interfaz gráfica oficial de Bull Board. Permite a los administradores e ingenieros 
      monitorear en tiempo real el estado de los trabajos de la cola de WhatsApp (`pending`, `active`, `completed`, `failed`), 
      auditar payloads multimedia (Base64/URLs) y forzar reintentos manuales de mensajes encallados.
    tags:
      - Panel de Administración
    responses:
      '200':
        description: |
          Carga exitosa del Frontend del tablero visual. 
          Devuelve un documento HTML/React interactivo completo.
        content:
          text/html:
            schema:
              type: string
              example: "<!DOCTYPE html><html><head><title>Bull Board</title></head><body>...</body></html>"
      '401':
        description: No autorizado. El token JWT de administrador no fue provisto o expiró.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: error
                statusCode:
                  type: integer
                  example: 401
                message:
                  type: string
                  example: Acceso denegado. Token inválido o ausente.
      '403':
        description: Prohibido. El usuario autenticado no posee el rol de Administrador.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: error
                statusCode:
                  type: integer
                  example: 403
                message:
                  type: string
                  example: No tienes los permisos requeridos para acceder a este recurso.
      '500':
        description: Error interno. Ocurrió un fallo de conexión con el servidor de Redis.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: error
                statusCode:
                  type: integer
                  example: 500
                message:
                  type: string
                  example: "Fallo de conexión en el clúster de Redis: Connection refused."

/admin/dashboard:
  get:
    summary: Obtener el resumen ejecutivo y analítico del sistema POS
    description: Consume métricas consolidadas de ventas, costes de compras a proveedores, cuadre de caja del día por método de pago y alertas de quiebre de stock en inventario.
    tags:
      - Panel de Administración
    responses:
      '200':
        description: Datos estadísticos consolidados correctamente.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "success"
                statusCode:
                  type: integer
                  example: 200
                action:
                  type: string
                  example: "GET_SYSTEM_DASHBOARD_ANALYTICS"
                module:
                  type: string
                  example: "DASHBOARD"
                data:
                  type: object
                  properties:
                    user:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "usr_b4f1a234"
                        email:
                          type: string
                          example: "admin@byteforge.com"
                    analytics:
                      $ref: '#/components/schemas/DashboardAnalyticsOutput'
      '500':
        description: Falla en los cálculos o agregados internos del motor PostgreSQL.